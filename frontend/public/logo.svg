<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Analytica FC">
  <defs>
    <linearGradient id="hexfill" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16233A"/>
      <stop offset="1" stop-color="#0A101C"/>
    </linearGradient>
    <clipPath id="hexclip">
      <path d="M32 3 56.2 17.5v29L32 61 7.8 46.5v-29L32 3Z"/>
    </clipPath>
  </defs>

  <!-- crest hexagon -->
  <path d="M32 3 56.2 17.5v29L32 61 7.8 46.5v-29L32 3Z" fill="url(#hexfill)" stroke="#334155" stroke-width="2.2"/>

  <!-- grafik samar di dalam crest -->
  <g clip-path="url(#hexclip)" stroke="#1E3A5F" stroke-width="1" opacity=".55">
    <path d="M8 40h48M8 48h48M8 32h48"/>
  </g>
  <path d="M8 40h48" stroke="#0EA5E9" stroke-width="1" opacity=".25" clip-path="url(#hexclip)"/>

  <!-- huruf A -->
  <path d="M20.5 46.5 32 19l11.5 27.5" stroke="#F8FAFC" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- palang A = tren naik-turun -->
  <path d="M24.3 37.5 27.9 33.3 31.1 36.6 34.9 31.4 38.9 35.5" stroke="#38BDF8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bola di puncak -->
  <circle cx="32" cy="16.4" r="4.9" fill="#0A101C" stroke="#F8FAFC" stroke-width="2"/>
  <path d="M28.4 15.1q3.6 2.8 7.2 0" stroke="#38BDF8" stroke-width="1.3" stroke-linecap="round"/>
</svg>
